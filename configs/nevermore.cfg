############### NeverMore Filter Config ###############

[gcode_macro nevermorevars]
variable_threshold: 90         # Start NeverMore automatically when bed target is at/above this temp
variable_speed: 1.0            # NeverMore speed while active
variable_cooldown_temp: 60     # Keep NeverMore running after print until bed cools below this temp
variable_cooldown_check: 20    # Delay (seconds) between cooldown temperature checks
gcode:

############### NeverMore Fan ###############

[fan_generic NeverMore]
pin: PB7
kick_start_time: 0.5

############### NeverMore Speed Macros ###############

[gcode_macro NeverMoreFast]
gcode:
    {% set SPEED = printer["gcode_macro nevermorevars"].speed|float %}
    SET_FAN_SPEED FAN=NeverMore SPEED={SPEED}     # Run NeverMore at configured speed

[gcode_macro NeverMoreOff]
gcode:
    SET_FAN_SPEED FAN=NeverMore SPEED=0           # Turn NeverMore off

############### NeverMore Control Macros ###############

[gcode_macro NeverMoreStartIfNeeded]
gcode:
    {% set THRESHOLD = printer["gcode_macro nevermorevars"].threshold|int %}
    {% set BED_TARGET = printer.heater_bed.target|int %}

    {% if BED_TARGET >= THRESHOLD %}
        NeverMoreFast                             # Start NeverMore if current bed target is high enough
    {% endif %}

[gcode_macro NeverMoreCooldownStart]
gcode:
    UPDATE_DELAYED_GCODE ID=NeverMore_cooldown DURATION=1   # Start cooldown monitoring loop after print

############### NeverMore Cooldown Loop ###############

[delayed_gcode NeverMore_cooldown]
initial_duration: 0
gcode:
    {% set COOLDOWN_TEMP = printer["gcode_macro nevermorevars"].cooldown_temp|int %}
    {% set CHECK_DELAY = printer["gcode_macro nevermorevars"].cooldown_check|int %}
    {% set BED_TEMP = printer.heater_bed.temperature|int %}

    {% if BED_TEMP >= COOLDOWN_TEMP %}
        NeverMoreFast                                            # Keep NeverMore running while bed is still hot
        UPDATE_DELAYED_GCODE ID=NeverMore_cooldown DURATION={CHECK_DELAY}
    {% else %}
        UPDATE_DELAYED_GCODE ID=NeverMore_cooldown DURATION=0    # Stop cooldown loop
        NeverMoreOff                                             # Bed cooled enough -> turn NeverMore off
    {% endif %}