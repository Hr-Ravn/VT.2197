#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to HV STEPPER 0
##  Endstop connected to X-ENDSTOP
[stepper_x]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 200 for 1.8 degree stepper
endstop_pin: tmc5160_stepper_x:virtual_endstop #PC1
position_min: -3
homing_speed: 80 #max 100
homing_retract_dist: 60
min_home_dist: 40
use_sensorless_homing: true
position_endstop: 304
position_max: 304
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_x]
cs_pin: PE15
spi_bus: spi4
diag0_pin: ^!PG1
interpolate: true
run_current: 0.8
home_current: 0.52
sense_resistor: 0.075
stealthchop_threshold: 0
#driver_SGT: 1

##  A Stepper - Right
##  Connected to HV STEPPER 1
##  Endstop connected to Y-ENDSTOP
[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 200 for 1.8 degree stepper
endstop_pin: tmc5160_stepper_y:virtual_endstop #PC2 
position_min: 0
homing_speed: 80 #Max 100
homing_retract_dist: 60
min_home_dist: 40
use_sensorless_homing: true
position_endstop: 312
position_max: 312
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_y]
cs_pin: PE11
spi_bus: spi4
diag0_pin: ^!PE10
interpolate: true
run_current: 0.8
home_current: 0.52
sense_resistor: 0.075
stealthchop_threshold: 0
driver_SGT: 1