#####################################################################
#   Macros
#####################################################################
[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    STATUS_LEVELING
    G90
    G28
    Z_TILT_ADJUST
    G28
    ##  Uncomment for for your size printer:
    #--------------------------------------------------------------------
    ##  Uncomment for 250mm build
    #G0 X125 Y125 Z30 F3600
    
    ##  Uncomment for 300 build
    G0 X150 Y150 Z30 F3600
    
    ##  Uncomment for 350mm build
    #G0 X175 Y175 Z30 F3600
    #--------------------------------------------------------------------
    RESTORE_GCODE_STATE NAME=STATE_G32


[gcode_macro _Disable_Cooldown]
gcode:
    UPDATE_DELAYED_GCODE ID=_bed_cooled_down DURATION=0
    COB_Light_on
    
[gcode_macro _NeverMoreStop]
description: Stop NeverMore cooldown loop and turn off NeverMore fan
gcode:
    UPDATE_DELAYED_GCODE ID=NeverMore_cooldown DURATION=0   # Stop cooldown monitoring loop
    NeverMoreOff                                            # Turn off NeverMore fan

[gcode_macro CoolDownStop]
description: Stop cooldown loop and turn off NeverMore fan
gcode:
  _NeverMoreStop
  _Disable_Cooldown

    
#####################################################################
#   Spoolman
#####################################################################

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

#####################################################################
#   LEDs
#####################################################################

[gcode_macro COB_Light_on]
gcode:
    SET_PIN PIN=caselight VALUE=1

[gcode_macro COB_Light_off]
gcode:
    SET_PIN PIN=caselight VALUE=0

[gcode_macro BLACKOUT]
gcode:
    SET_PIN PIN=caselight VALUE=0
    STATUS_OFF
    TURN_OFF_AFC_LED

[gcode_macro BLIND_ME]
gcode:
    STATUS_READY
    SET_PIN PIN=caselight VALUE=1
    TURN_ON_AFC_LED
    
#####################################################################
#   Delayed Gcodes
#####################################################################

[delayed_gcode _bed_cooled_down]
initial_duration: 0
gcode:
    {% if printer.heater_bed.temperature <=65 %}
      STATUS_PART_READY
      M117 $MR$:Print done, bed cooled!
      G4 P60000
      M117 $MR$:Going to sleep, until you let me print!
      BLACKOUT
      M84
    {% else %}
      SET_PIN PIN=caselight VALUE=0.15
      STATUS_COOLING
      UPDATE_DELAYED_GCODE ID=_bed_cooled_down DURATION=10
    {% endif %}


