[gcode_macro BEDFAN_DISABLE]
gcode:
    UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=0
    UPDATE_DELAYED_GCODE ID=bedfan_fast_ramp DURATION=0
    SET_GCODE_VARIABLE MACRO=bedfanstate VARIABLE=hot_chamber VALUE=0
    SET_GCODE_VARIABLE MACRO=bedfanstate VARIABLE=ramp_stage VALUE=0
    {action_respond_info("Bed fan control disabled")}

[gcode_macro CHAMBER_LIMIT]
description: Set chamber limit temperature
gcode:
    {% set LIMIT = params.VALUE|float %}
    SET_GCODE_VARIABLE MACRO=bedfanvars VARIABLE=chamber_limit VALUE={LIMIT}
    {action_respond_info("Chamber limit set to %.1fC" % (LIMIT))}



[gcode_macro CHAMBER_RESUME]
description: Set chamber resume temperature
gcode:
    {% set RESUME = params.VALUE|float %}
    SET_GCODE_VARIABLE MACRO=bedfanvars VARIABLE=chamber_resume VALUE={RESUME}
    {action_respond_info("Chamber resume set to %.1fC" % (RESUME))}